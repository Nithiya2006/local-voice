<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <!-- Pin Blue 3D Gradient -->
    <linearGradient id="lvPinGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="35%" stop-color="#0084FF" />
      <stop offset="100%" stop-color="#004AD7" />
    </linearGradient>

    <!-- Green Hill Gradient -->
    <linearGradient id="lvGreenGrad" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="40%" stop-color="#16A34A" />
      <stop offset="100%" stop-color="#84CC16" />
    </linearGradient>

    <!-- Road 3D Sheen -->
    <linearGradient id="lvRoadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="80%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Glossy Highlight Gradient -->
    <linearGradient id="lvGlossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="lvShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#004AD7" flood-opacity="0.35" />
    </filter>

    <!-- Inner Circle Shadow -->
    <filter id="lvCircleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.18" />
    </filter>

    <!-- Pin Clip Path -->
    <clipPath id="lvPinClip">
      <path d="M 100,12 C 144,12 178,46 178,90 C 178,128 140,164 100,192 C 60,164 22,128 22,90 C 22,46 56,12 100,12 Z" />
    </clipPath>
  </defs>

  <!-- Pin Outer Glow & Body -->
  <g filter="url(#lvShadow)">
    <path
      d="M 100,12 C 144,12 178,46 178,90 C 178,128 140,164 100,192 C 60,164 22,128 22,90 C 22,46 56,12 100,12 Z"
      fill="url(#lvPinGrad)"
    />
  </g>

  <!-- Content Clipped to Pin -->
  <g clip-path="url(#lvPinClip)">
    <!-- Glossy upper left sheen -->
    <ellipse cx="65" cy="50" rx="45" ry="30" fill="url(#lvGlossGrad)" transform="rotate(-25 65 50)" />

    <!-- Center White Background Circle -->
    <circle cx="100" cy="84" r="50" fill="#FFFFFF" filter="url(#lvCircleShadow)" />

    <!-- Microphone Body (Navy/Dark Blue) -->
    <!-- Capsule -->
    <rect x="88" y="56" width="20" height="32" rx="10" fill="#0A1E3F" />
    <!-- White Grille Horizontal Lines -->
    <line x1="91" y1="65" x2="105" y2="65" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    <line x1="91" y1="71" x2="105" y2="71" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    <line x1="91" y1="77" x2="105" y2="77" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />

    <!-- Mic Cradle U-Shape -->
    <path
      d="M 83,72 C 83,89 113,89 113,72"
      fill="none"
      stroke="#0A1E3F"
      stroke-width="3.5"
      stroke-linecap="round"
    />
    <!-- Mic Stand Stem -->
    <line x1="98" y1="89" x2="98" y2="99" stroke="#0A1E3F" stroke-width="4" stroke-linecap="round" />
    <!-- Mic Stand Base -->
    <line x1="88" y1="99" x2="108" y2="99" stroke="#0A1E3F" stroke-width="4" stroke-linecap="round" />

    <!-- Sound Waves (Bright Blue) on the Right of Mic -->
    <!-- Wave 1 (Inner) -->
    <path
      d="M 119,74 C 122,78 122,83 119,87"
      fill="none"
      stroke="#0084FF"
      stroke-width="3"
      stroke-linecap="round"
    />
    <!-- Wave 2 (Middle) -->
    <path
      d="M 126,68 C 131,75 131,86 126,93"
      fill="none"
      stroke="#0084FF"
      stroke-width="3.2"
      stroke-linecap="round"
    />
    <!-- Wave 3 (Outer) -->
    <path
      d="M 133,62 C 140,72 140,89 133,99"
      fill="none"
      stroke="#0084FF"
      stroke-width="3.2"
      stroke-linecap="round"
    />

    <!-- Green Landscape / Hill (Bottom Half) -->
    <path
      d="M 10,138 C 45,108 90,105 130,108 C 160,110 185,122 195,135 L 195,200 L 5,200 Z"
      fill="url(#lvGreenGrad)"
    />

    <!-- Winding White Road -->
    <path
      d="M 82,192 C 86,168 88,150 112,136 C 120,131 116,120 100,108 C 96,114 105,124 97,133 C 83,148 72,168 82,192 Z"
      fill="url(#lvRoadGrad)"
      stroke="#047857"
      stroke-width="0.75"
    />
    <!-- Road Dashed Center Divider -->
    <path
      d="M 88,186 C 92,166 94,149 107,135 C 111,130 109,122 100,108"
      fill="none"
      stroke="#10B981"
      stroke-width="1.75"
      stroke-dasharray="3 3"
      stroke-linecap="round"
    />

    <!-- Bottom Pin Tip Edge Shadow/Accent -->
    <path
      d="M 100,192 L 105,182 C 102,187 98,187 95,182 Z"
      fill="#003580"
      opacity="0.5"
    />
  </g>

  <!-- Pin Outer Border Highlight -->
  <path
    d="M 100,12 C 144,12 178,46 178,90 C 178,128 140,164 100,192 C 60,164 22,128 22,90 C 22,46 56,12 100,12 Z"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="1.5"
    stroke-opacity="0.35"
  />
</svg>
